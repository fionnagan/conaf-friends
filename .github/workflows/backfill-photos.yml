name: Backfill Photos

# One-off backfill: resolves a profile photo for guests with none yet
# (570/3,260 currently have one — the pipeline exists but has never been
# wired into any automated job, so coverage never grew past whatever was
# run manually). Genuinely cheap to run at scale: only Wikipedia +
# Wikimedia Commons requests, no paid API, no ANTHROPIC_API_KEY — the only
# cost is compute time.
#
# Note on quality: this runner doesn't install the optional face_recognition/
# deepface Python backend (dlib's build step is slow and fragile in CI), so
# it runs in the pipeline's documented "no face backend" fallback — auto-
# approves the best-scored candidate from a highly-trusted source (Wikipedia
# scores 1.0, Wikimedia Commons 0.95, both above the 0.85 auto-approve bar)
# without the identity-cluster cross-check. Since every candidate here
# already comes from Wikipedia/Commons, this still auto-approves the large
# majority of guests; add face_recognition to the pip install step later if
# stricter face verification in CI turns out to matter.
#
# `limit` controls how many guests to process THIS run in total. Runs in
# chunks of 100, committing + pushing after each — safe to set high, since a
# failure mid-run only costs the in-flight chunk. Re-running only ever picks
# up guests still missing a photo, so nothing gets reprocessed.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max guests to process this run (total, across all chunks)"
        required: false
        default: "200"

# Only one Wikipedia-touching workflow runs at a time — a second trigger
# queues behind whichever one is already running instead of both hitting
# the same rate limits simultaneously.
concurrency:
  group: wikipedia-ingest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install pillow numpy requests

      - name: Backfill photos in chunks, committing progress after each
        env:
          # Passed as a real env var, referenced via $INPUT_LIMIT, not
          # interpolated via ${{ }} into the script body — GitHub substitutes
          # ${{ }} as literal text into the run: script BEFORE bash executes
          # it, so a crafted workflow_dispatch input could otherwise execute
          # as arbitrary shell in a runner holding contents:write.
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHUNK=100
          TOTAL="$INPUT_LIMIT"
          DONE=0

          while [ "$DONE" -lt "$TOTAL" ]; do
            REMAINING=$((TOTAL - DONE))
            THIS_CHUNK=$((REMAINING < CHUNK ? REMAINING : CHUNK))

            echo "=== Chunk: $THIS_CHUNK guests (done so far: $DONE/$TOTAL) ==="
            npx tsx scripts/ingest/photo-enrichment.ts --limit "$THIS_CHUNK"
            npx tsx scripts/ingest/patch-photos-into-guests.ts

            git add data/guests.json
            git add -f scripts/cache/photos.json scripts/cache/review-queue.json scripts/cache/enrichment-log.json scripts/cache/source-trust.json
            if git diff --staged --quiet; then
              echo "No changes this chunk — backlog is exhausted, stopping early."
              break
            fi
            # Single rebase+push attempt, no retry — the same gap PR #44
            # fixed in backfill-full-bios.yml by adopting this shared script
            # (a genuine rebase conflict, not just a push race, would kill
            # every remaining chunk with no retry otherwise).
            scripts/ci/commit-and-push.sh "chore: backfill photos (chunk of $THIS_CHUNK)"

            DONE=$((DONE + THIS_CHUNK))
          done

          echo "=== Done: processed up to $DONE guest(s) this run ==="
