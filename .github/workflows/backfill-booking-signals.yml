name: Backfill Booking Signals

# One-off backfill: fills birth_year/nationality/prestige_signals/
# primary_platform for guests enriched BEFORE those fields existed (PR #15).
# Confirmed via a real check that 0 of 3,260 guests currently have
# birth_year — this blocks the Guest Explorer's Generation filter for
# everyone. `limit` controls how many guests to process THIS run — start
# small to validate, then re-run with a larger limit (repeatedly, if needed)
# to work through the rest. Safe to run as many times as needed: each run
# only touches guests still missing the fields.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max guests to process this run"
        required: false
        default: "20"
      retryEmpty:
        description: "Also reprocess guests already checked with an empty birth_year (set true after a bug fix)"
        required: false
        default: "false"
      guest:
        description: "Debug: process only this one guest by exact name, ignoring limit/retryEmpty filters"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Backfill booking-signal fields
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx scripts/ingest/backfill-booking-signals.ts \
            --limit ${{ github.event.inputs.limit }} \
            ${{ github.event.inputs.retryEmpty == 'true' && '--retry-empty' || '' }} \
            ${{ github.event.inputs.guest != '' && format('--guest "{0}"', github.event.inputs.guest) || '' }}

      - name: Patch updated bios into guests.json
        run: npx tsx scripts/ingest/patch-bios-into-guests.ts

      - name: Commit updated data
        # Confirmed via a real run: this workflow's checkout can go stale
        # while it's mid-run if another workflow/PR pushes to main first
        # (happened with the roundup page's PR landing mid-backfill) — a
        # plain `git push` then fails "fetch first" and silently drops this
        # run's computed birth_year/nationality data. Rebase onto the
        # latest main before pushing so the commit still lands; if that
        # rebase itself conflicts (overlapping edits to the same guest),
        # let the step fail loudly rather than force through it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/guests.json
          git add -f scripts/cache/bios.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: backfill booking-signal fields (limit ${{ github.event.inputs.limit }})"
            git pull --rebase origin main
            git push
          fi
