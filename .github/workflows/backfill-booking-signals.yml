name: Backfill Booking Signals

# One-off backfill: fills birth_year/nationality/prestige_signals/
# primary_platform for guests enriched BEFORE those fields existed (PR #15).
# Confirmed via a real check that 0 of 3,260 guests currently have
# birth_year — this blocks the Guest Explorer's Generation filter for
# everyone. `limit` controls how many guests to process THIS run — start
# small to validate, then re-run with a larger limit (repeatedly, if needed)
# to work through the rest. Safe to run as many times as needed: each run
# only touches guests still missing the fields.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max guests to process this run"
        required: false
        default: "20"
      retryEmpty:
        description: "Also reprocess guests already checked with an empty birth_year (set true after a bug fix)"
        required: false
        default: "false"
      guest:
        description: "Debug: process only this one guest by exact name, ignoring limit/retryEmpty filters"
        required: false
        default: ""

# Only one Wikipedia-touching workflow runs at a time — a second trigger
# queues behind whichever one is already running instead of both hitting
# the same rate limits simultaneously.
concurrency:
  group: wikipedia-ingest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Backfill booking-signal fields
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed as real env vars and referenced via $VARNAME, not
          # interpolated via ${{ }} into the script body — GitHub substitutes
          # ${{ }} as literal text into the run: script BEFORE bash executes
          # it. `guest` is genuinely free text (a guest name), so the old
          # `format('--guest "{0}"', ...)` construct — which only does string
          # formatting, not shell-escaping — let a crafted guest name break
          # out of its quoting and inject arbitrary shell into a runner
          # holding contents:write and ANTHROPIC_API_KEY. A bash array built
          # from env vars passes each value as a real argv element regardless
          # of its content (quotes, semicolons, whatever), so nothing in it
          # is ever re-parsed as script text.
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_RETRY_EMPTY: ${{ github.event.inputs.retryEmpty }}
          INPUT_GUEST: ${{ github.event.inputs.guest }}
        run: |
          ARGS=(--limit "$INPUT_LIMIT")
          if [ "$INPUT_RETRY_EMPTY" = "true" ]; then
            ARGS+=(--retry-empty)
          fi
          if [ -n "$INPUT_GUEST" ]; then
            ARGS+=(--guest "$INPUT_GUEST")
          fi
          npx tsx scripts/ingest/backfill-booking-signals.ts "${ARGS[@]}"

      - name: Patch updated bios into guests.json
        run: npx tsx scripts/ingest/patch-bios-into-guests.ts

      - name: Commit updated data
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/guests.json
          git add -f scripts/cache/bios.json
          scripts/ci/commit-and-push.sh "chore: backfill booking-signal fields (limit $INPUT_LIMIT)"
