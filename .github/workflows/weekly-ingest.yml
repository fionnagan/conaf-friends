name: Weekly Episode Ingest

on:
  schedule:
    # Every Monday at 9:00 AM EST (14:00 UTC)
    - cron: "0 14 * * 1"
  workflow_dispatch: # Allow manual trigger

# Only one Wikipedia-touching workflow runs at a time — a second trigger
# queues behind whichever one is already running instead of both hitting
# the same rate limits simultaneously.
concurrency:
  group: wikipedia-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies (word cloud, RAG sync)
        run: pip install pillow numpy requests

      - name: Run ingest pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Always fetch fresh RSS — delete stale cache so new episodes aren't missed
          rm -f scripts/cache/podcast-episodes.json
          npx tsx scripts/ingest/index.ts

      # Fetch transcripts for any new episodes, rebuild chunks.jsonl, and embed +
      # upsert only the un-embedded ones into Pinecone — keeps search_episodes (the
      # Ask the Registry RAG tool) current without re-processing the whole corpus
      # every week. Best-effort: a podscripts.co/Voyage/Pinecone hiccup, or missing
      # secrets, must never block the metadata + context refresh below.
      - name: Sync RAG transcript corpus
        continue-on-error: true
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
        run: python3 scripts/ingest/sync-transcripts.py

      # Enrich bios for any newly-added guests (incremental — only touches
      # un-cached guests, capped at 50/run). Best-effort: a Wikipedia/Anthropic
      # hiccup must never block the data + context refresh below.
      - name: Enrich bios for new guests
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run enrich:bios

      # Fold any freshly-enriched bios (written to scripts/cache/bios.json) back
      # into data/guests.json. No network — pure re-merge from caches.
      - name: Re-merge caches into guests.json
        run: npx tsx scripts/ingest/run-merge.ts

      # Regenerate the Ask the Registry agent's context file from the updated
      # guests.json. Without this the agent would keep answering from a frozen
      # snapshot while the rest of the site shows new guests.
      - name: Regenerate agent context (Ask the Registry)
        run: npm run emit:context

      - name: Regenerate word cloud
        run: python3 scripts/generate-wordcloud.py

      # "Crossed Paths": track Conan's OWN recent activity (film/TV roles,
      # hosting gigs, podcast guest spots), then cross-reference his films'
      # casts and soundtracks against guests.json — surfacing both existing
      # guests he crossed paths with and brand-new candidates who've never
      # been booked (validated for real against Toy Story 5 in PRs #17-#25).
      # Best-effort: a Wikipedia hiccup here must never block the site update.
      - name: Track Conan's own activity (Crossed Paths, step 1)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/ingest/fetch-conan-activity.ts

      - name: Cross-reference film/soundtrack casts against guests (Crossed Paths, step 2)
        continue-on-error: true
        run: npx tsx scripts/ingest/fetch-crossed-paths.ts

      # Personal/social crossed-paths (e.g. an invitation, a public appearance
      # together) never show up in Wikipedia — only entertainment press. This
      # only has a real chance of catching an event while it's still in each
      # outlet's RSS feed, hence running it weekly rather than as a one-off.
      - name: Scan trade press for personal crossed-paths
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx scripts/ingest/fetch-trade-press.ts
          npx tsx scripts/ingest/match-personal-crossed-paths.ts

      # Folds the three caches above into data/crossed-paths.json — the file
      # the site actually reads. Pure re-merge, no network; runs even if a
      # step above failed/was skipped (falls back to empty for that source).
      - name: Merge crossed-paths data
        run: npx tsx scripts/ingest/merge-crossed-paths.ts

      # Guard: never auto-deploy corrupted or truncated data. Fails the job (so
      # nothing is committed or deployed) if guests.json won't parse, the guest
      # count collapsed (e.g. an empty RSS fetch), or emit_context produced a
      # short context file.
      - name: Validate data before commit
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          try:
              new = json.load(open('data/guests.json'))
          except Exception as e:
              print(f'FAIL: data/guests.json is not valid JSON: {e}'); sys.exit(1)
          n = new.get('totalGuests', 0)
          if n <= 0:
              print('FAIL: totalGuests is 0'); sys.exit(1)
          try:
              old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:data/guests.json']))
              old_n = old.get('totalGuests', 0)
          except Exception:
              old_n = 0
          if old_n and n < old_n * 0.9:
              print(f'FAIL: totalGuests dropped sharply {old_n} -> {n} (>10%); refusing to ship'); sys.exit(1)
          try:
              ctx = json.load(open('api/guests_context.json'))
          except Exception as e:
              print(f'FAIL: api/guests_context.json invalid: {e}'); sys.exit(1)
          if len(ctx) < n * 0.9:
              print(f'FAIL: context has {len(ctx)} entries vs {n} guests; emit_context likely broken'); sys.exit(1)
          print(f'OK: guests {old_n} -> {n}, context {len(ctx)} entries')
          PY

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/guests.json data/cold-opens.json data/top-words.json data/word-guests.json data/guest-photos.json data/fans.json data/crossed-paths.json
          git add api/guests_context.json
          git add public/conan-wordcloud.png
          git add -f scripts/cache/youtube-matches.json scripts/cache/bios.json
          git add scripts/ingest/transcripts/ scripts/ingest/chunks.jsonl scripts/ingest/embedded-episodes.json
          scripts/ci/commit-and-push.sh "chore: weekly episode ingest $(date -u '+%Y-%m-%d')"
