name: Sample Bio Enrichment

# One-off, read-only preview of the extended bio-enrichment fields (birth_year,
# nationality, prestige_signals, primary_platform) against real guests — nothing
# here commits or pushes anything. Run it, then read the printed JSON in the job
# log to see exactly what the "Booking Signals" fields would look like before
# deciding whether to backfill all ~3,260 guests.

on:
  workflow_dispatch:
    inputs:
      guests:
        description: "Comma-separated guest names to sample"
        required: false
        default: "Bill Burr,Daniel Radcliffe,Nick Offerman,Weird Al Yankovic,Kenan Thompson,Andy Daly,Robert Smigel"

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Enrich each sample guest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          > /tmp/sample-guest-names.txt
          IFS=',' read -ra NAMES <<< "${{ github.event.inputs.guests }}"
          for name in "${NAMES[@]}"; do
            trimmed="$(echo "$name" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            echo "$trimmed" >> /tmp/sample-guest-names.txt
            echo ""
            echo "=== Enriching: $trimmed ==="
            npx tsx scripts/ingest/enrich-bios.ts --force --guest "$trimmed" || echo "(failed for $trimmed, continuing)"
          done

      - name: Print sampled results
        run: |
          # bios.json holds the FULL production cache (thousands of guests) — print
          # only the names we just sampled, not the whole file.
          node -e '
            const fs = require("fs");
            const bios = JSON.parse(fs.readFileSync("scripts/cache/bios.json", "utf8"));
            const names = fs.readFileSync("/tmp/sample-guest-names.txt", "utf8")
              .split("\n").map(s => s.trim()).filter(Boolean);
            for (const name of names) {
              console.log("\n================= " + name + " =================");
              console.log(JSON.stringify(bios[name] ?? { error: "not found" }, null, 2));
            }
          '
